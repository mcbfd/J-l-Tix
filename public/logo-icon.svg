      <stop offset="0%" stop-color="#0E57E8" />
      <stop offset="100%" stop-color="#002D8C" />
    </linearGradient>
    <linearGradient id="icon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55F018" />
