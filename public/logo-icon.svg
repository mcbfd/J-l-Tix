    <path d="M 3 0 L 26 0 A 3 3 0 0 1 29 3 A 3 3 0 0 0 35 3 A 3 3 0 0 1 38 6 L 38 22 A 3 3 0 0 1 35 25 A 3 3 0 0 0 29 25 A 3 3 0 0 1 26 28 L 3 28 A 3 3 0 0 1 0 25 L 0 3 A 3 3 0 0 1 3 0 Z" 
